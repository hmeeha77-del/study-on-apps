<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>목표 레시피 챌린지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#FBF8F2;--card:#FFFFFF;--ink:#2A3350;--sub:#5B6482;--line:#E4DFD3;--accent:#3F6FD8;--accentInk:#FFFFFF;--ok:#DDF3EA;--okInk:#17614A;--no:#FFE8DF;--noInk:#8A3A1F;--sel:#E8EEFC;--bar:#E9E4D8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171B2B;--card:#222842;--ink:#F1EEE6;--sub:#B4BAD2;--line:#38405F;--accent:#8FB0FF;--accentInk:#15213F;--ok:#1E3A33;--okInk:#9CE3C6;--no:#44281F;--noInk:#FFC3AB;--sel:#2C3760;--bar:#38405F}}
:root[data-theme="dark"]{--bg:#171B2B;--card:#222842;--ink:#F1EEE6;--sub:#B4BAD2;--line:#38405F;--accent:#8FB0FF;--accentInk:#15213F;--ok:#1E3A33;--okInk:#9CE3C6;--no:#44281F;--noInk:#FFC3AB;--sel:#2C3760;--bar:#38405F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55;min-height:100vh}
main{max-width:860px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(34px,6vw,54px);font-weight:800;line-height:1.15;margin:0 0 14px}
h2{font-size:clamp(24px,4vw,32px);font-weight:800;line-height:1.35;margin:0 0 6px}
p{margin:0}
.lead{font-size:clamp(18px,2.6vw,22px);color:var(--sub);max-width:36em}
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.count{font-weight:700;font-size:18px;white-space:nowrap}
.bar{flex:1;height:12px;border-radius:99px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px)}
.tag{display:inline-block;font-weight:700;font-size:17px;padding:4px 14px;border-radius:99px;background:var(--sel);margin-bottom:12px}
.q{font-size:clamp(22px,3.6vw,30px);font-weight:700;line-height:1.5;margin:6px 0 22px}
.opts{display:grid;gap:12px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;font-size:clamp(18px,2.6vw,22px);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 18px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.opt.right{border-color:var(--okInk);background:var(--ok)}
.opt.wrong{border-color:var(--noInk);background:var(--no)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-weight:700;font-size:18px}
.btn{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:14px;padding:14px 28px;cursor:pointer;background:var(--accent);color:var(--accentInk);min-height:52px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.fb{margin-top:20px;border-radius:16px;padding:18px 20px;font-size:clamp(18px,2.5vw,21px)}
.fb b{display:block;font-size:clamp(20px,3vw,24px);margin-bottom:4px}
.fb.ok{background:var(--ok);color:var(--okInk)}
.fb.no{background:var(--no);color:var(--noInk)}
.pt{margin-top:10px;font-size:18px;opacity:.9}
.sum{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.sum li{display:flex;gap:12px;background:var(--bg);border-radius:14px;padding:12px 16px;font-size:18px}
.sum span{flex:none;font-weight:800;color:var(--accent)}
.hero{display:flex;gap:10px;margin:26px 0 30px}
.hero i{width:44px;height:44px;border-radius:50%}
.hero i:nth-child(1){background:#BFE8DC}.hero i:nth-child(2){background:#FFE7A3}.hero i:nth-child(3){background:#FFD3C2}.hero i:nth-child(4){background:#DCD3F5}.hero i:nth-child(5){background:#CFE0FF}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var M=[
{t:"목표 탐정",tag:"소원일까, 목표일까?",q:"민준이는 수학을 더 잘하고 싶어요. 다음 중 이번 주에 실천할 목표로 가장 알맞은 것은?",o:["수학 천재 되기","수학을 좋아하기","월요일부터 금요일까지 하루 3문제씩 풀고, 틀린 문제는 다시 풀기","다음 시험에서 무조건 100점 받기"],a:2,e:"언제 무엇을 할지 구체적이고, 자신이 직접 실천했는지 확인할 수 있어요.",p:"막연한 바람과 구체적인 목표의 차이를 알아봐요.",h:"‘이번 주에 내가 했는지 확인할 수 있는가?’를 생각해 보세요."},
{t:"목표의 순서",tag:"완성까지의 길 찾기",q:"장기 목표가 ‘영어로 좋아하는 책 읽기’라면, 그 목표에 가까워지기 위한 중기 목표로 가장 알맞은 것은?",o:["오늘 영어 단어 5개 외우기","1년 안에 자주 나오는 영어 단어와 문장 표현을 익히고 쉬운 영어책 읽기","영어를 아주 잘하는 사람이 되기","지금 영어책 한 페이지 읽기"],a:1,e:"중기 목표는 장기 목표와 오늘의 행동을 이어 주는 중간 단계예요.",p:"장기·중기·작은 목표가 어떻게 이어지는지 알아봐요.",h:"너무 멀지도, 너무 가깝지도 않은 중간 단계를 찾아보세요."},
{t:"레시피 오류 수정",tag:"무엇이 빠졌을까?",q:"지우의 목표는 ‘그림을 잘 그리기’예요. 목표를 더 실천하기 좋게 바꾸려면?",o:["유명한 화가 되기","그림을 매일 많이 그리기","이번 주에 하루 10분씩 그림을 연습하고, 완성한 그림 한 장을 모으기","그림을 잘 그리는 친구처럼 되기"],a:2,e:"시간과 행동이 구체적이면 언제 시작하고 무엇을 확인할지 알 수 있어요.",p:"목표를 구체적인 행동과 기간으로 표현해 봐요.",h:"‘얼마나’, ‘언제’가 들어 있는지 살펴보세요."},
{t:"나만의 재료 선택",tag:"어떤 목표가 필요할까?",q:"아직 장래 희망이 정해지지 않았어요. 목표 레시피를 만들 때 어떻게 시작하면 좋을까요?",o:["꿈이 정해질 때까지 기다리기","다른 친구의 꿈을 그대로 따라 하기","요즘 좋아하는 것, 더 잘하고 싶은 것, 해보고 싶은 것 중 하나 고르기","큰 목표부터 무조건 정하기"],a:2,e:"진로가 정해지지 않아도 관심사나 지금 바꾸고 싶은 행동에서 출발할 수 있어요.",p:"꿈이 없어도 지금의 관심사에서 목표를 시작할 수 있어요.",h:"지금 내 곁에 있는 재료에서 시작하는 방법을 찾아보세요."},
{t:"첫 행동 정하기",tag:"이번 주에 시작하기",q:"‘공부 습관 만들기’라는 목표를 세웠어요. 오늘 바로 할 수 있는 작은 목표는?",o:["앞으로 공부를 잘하기","공부하는 사람이 되기","오늘 저녁 7시에 책상에 앉아 내일 할 공부 2가지를 적기","이번 학기에 전 과목 만점 받기"],a:2,e:"작은 목표는 지금 또는 이번 주에 직접 실행할 수 있는 구체적인 행동이어야 해요.",p:"큰 목표를 지금 할 수 있는 행동으로 바꿔 봐요.",h:"‘오늘’ 바로 할 수 있고 시간까지 정해진 것을 찾아보세요."}
];
var app=document.getElementById('app'),S;
function reset(){S={i:-1,sel:null,tries:0,done:false,order:[],hit:[]}}
function shuffle(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function start(){reset();S.i=0;S.order=shuffle(4);render()}
function pick(k){if(S.done)return;S.sel=k;render()}
function check(){var m=M[S.i],ok=S.order[S.sel]===m.a;S.tries++;if(ok||S.tries>=2){S.done=true;S.hit[S.i]=ok&&S.tries===1}else{S.wrong=S.sel;S.sel=null}S.last=ok;render()}
function retry(){S.last=null;render()}
function next(){S.i++;S.sel=null;S.tries=0;S.done=false;S.wrong=null;S.last=null;S.order=shuffle(4);render()}
function render(){
 var h='';
 if(S.i<0){
  h='<h1>목표 레시피 챌린지</h1><p class="lead">좋은 목표에는 어떤 재료가 들어갈까요? 미션 5개를 풀며 목표를 세우는 방법을 알아봐요. 정답을 맞히는 게임이 아니라, 생각하는 연습이에요.</p><div class="hero" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><button class="btn" id="go">챌린지 시작</button><p class="lead" style="margin-top:18px;font-size:17px">약 8~10분 · 미션 5개</p>';
 }else if(S.i>=M.length){
  h='<div class="top"><span class="count">완료</span><div class="bar"><i style="width:100%"></i></div></div><div class="card"><h2>목표 레시피 준비 완료!</h2><p class="lead" style="margin-top:10px">목표를 세우는 방법을 알아봤어요! 이제 나의 관심 재료를 고르고, 장기·중기·작은 목표를 연결해 나만의 목표 레시피를 만들어 봐요.</p><ul class="sum">'+M.map(function(m,k){return'<li><span>'+(k+1)+'</span><div><b>'+m.t+'</b><br>'+m.p+'</div></li>'}).join('')+'</ul><div class="row"><button class="btn ghost" id="again">다시 도전하기</button></div></div>';
 }else{
  var m=M[S.i],pct=Math.round((S.i+(S.done?1:0))/M.length*100);
  h='<div class="top"><span class="count">미션 '+(S.i+1)+'/'+M.length+'</span><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div></div>';
  h+='<div class="card"><span class="tag">미션 '+(S.i+1)+'. '+m.t+' · '+m.tag+'</span><p class="q">'+esc(m.q)+'</p><ul class="opts">';
  S.order.forEach(function(oi,k){
   var c='opt',dis=S.done||false;
   if(S.done){if(oi===m.a)c+=' right';else if(S.sel===k)c+=' wrong';else c+=' dim'}
   else if(S.wrong===k)c+=' wrong dim';
   h+='<li><button class="'+c+'" data-k="'+k+'" aria-pressed="'+(S.sel===k)+'"'+(dis||S.wrong===k?' disabled':'')+'><span class="n">'+'①②③④'[k]+'</span><span>'+esc(m.o[oi])+'</span></button></li>';
  });
  h+='</ul>';
  if(S.done){
   if(S.last&&S.tries===1)h+='<div class="fb ok" role="status"><b>잘 찾았어요!</b>'+m.e+'<div class="pt">배운 점: '+m.p+'</div></div>';
   else if(S.last)h+='<div class="fb ok" role="status"><b>이번에는 찾았어요!</b>'+m.e+'<div class="pt">배운 점: '+m.p+'</div></div>';
   else h+='<div class="fb no" role="status"><b>정답은 초록색 보기예요.</b>'+m.e+'<div class="pt">배운 점: '+m.p+'</div></div>';
   h+='<div class="row"><button class="btn" id="next">'+(S.i===M.length-1?'결과 보기':'다음 미션')+'</button></div>';
  }else if(S.last===false){
   h+='<div class="fb no" role="status"><b>다시 한번 생각해 볼까요?</b>힌트: '+m.h+'</div><div class="row"><button class="btn" id="retry">다시 고르기</button></div>';
  }else{
   h+='<div class="row"><button class="btn" id="chk"'+(S.sel===null?' disabled':'')+'>정답 확인</button></div>';
  }
  h+='</div>';
 }
 app.innerHTML=h;
 var q=function(id){return document.getElementById(id)};
 if(q('go'))q('go').onclick=start;if(q('again'))q('again').onclick=function(){reset();render()};
 if(q('chk'))q('chk').onclick=check;if(q('next'))q('next').onclick=next;if(q('retry'))q('retry').onclick=retry;
 Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){pick(+b.getAttribute('data-k'))}});
}
reset();render();
</script>
</body>
</html>
