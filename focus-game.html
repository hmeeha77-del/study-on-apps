<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:#FAF8F3;color:#2B3A67;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:#0E7C70;font-weight:700;font-size:14px;margin-bottom:12px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.mode{background:#E3F6F3;color:#0E7C70;font-size:15px}
.mode.on{background:#1FB5A3;color:#fff}
.primary{background:#FFC83D;color:#16294F;width:100%;font-size:18px}
.sec{background:#eef0f6;color:#2B3A67}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.sw{display:flex;gap:8px;align-items:center;font-weight:700;background:#FFE3D6;border-radius:12px;padding:10px 12px}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.big{font-size:56px;letter-spacing:8px;text-align:center;font-weight:800;margin:10px 0;color:#16294F}
.hint{text-align:center;font-size:18px;color:#0E7C70;margin-bottom:10px}
input[type=text]{width:100%;font-size:22px;padding:12px;border:2px solid #cfd6e6;border-radius:12px;font-family:inherit;text-align:center}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tile{width:64px;height:64px;font-size:30px;background:#2B3A67;color:#fff;border-radius:14px}
.tile.used{opacity:.25}
.slot{width:64px;height:64px;border:3px dashed #1FB5A3;border-radius:14px;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;background:#fff}
.msg{min-height:26px;text-align:center;font-weight:700}
.grid{display:grid;gap:4px;margin:10px auto;max-width:420px;touch-action:manipulation}
.cell{aspect-ratio:1;font-size:22px;background:#f1f3f9;color:#2B3A67;padding:0;border-radius:10px}
.cell.pick{background:#FFC83D}.cell.found{background:#1FB5A3;color:#fff}
.words{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.words span{background:#eef0f6;border-radius:999px;padding:4px 12px;font-weight:700}
.words span.ok{background:#1FB5A3;color:#fff;text-decoration:line-through}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e3e6ef;text-align:center}
.hide{display:none}
.cd{height:10px;background:#e3e6ef;border-radius:99px;overflow:hidden;margin:4px 0 10px}.cd i{display:block;height:100%;background:#1FB5A3;width:100%}.cdt{text-align:center;font-weight:700;color:#0E7C70}
.note{font-size:14px;color:#5b6690;line-height:1.5}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#16294F;color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;z-index:9;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
.float{position:fixed;font-size:44px;z-index:8;pointer-events:none;animation:fl 3.2s linear forwards}
@keyframes fl{from{transform:translateX(-80px) rotate(0)}to{transform:translateX(110vw) rotate(360deg)}}

<div id="toast"></div>
<div class="wrap">

<div class="sub">점수 대결이 아니에요! 나의 집중 상태를 알아보는 게임이에요.</div>

<div class="card" id="setup">
  <div class="row" style="margin-bottom:10px"><b>게임 고르기</b></div>
  <div class="modes">
    <button class="mode on" data-m="cho">🔤 초성 퀴즈</button>
    <button class="mode" data-m="scr">🔀 흩어진 글자</button>
    <button class="mode" data-m="find">🔍 단어 찾기</button>
  </div>
  <p class="note" id="modeDesc"></p>
  <div class="row" style="margin:10px 0"><b>단어 묶음</b>
    <select id="cat" style="font-size:16px;padding:8px;border-radius:10px;font-family:inherit"><option value="study">📚 공부·집중 단어</option><option value="fun">🎮 요즘 관심 단어 (공부와 관계없음)</option><option value="mix">🔀 섞어서</option></select></div>
  <p class="note" id="catDesc"></p>
  <div class="row" style="margin:10px 0"><b>난이도</b><select id="lv" style="font-size:16px;padding:8px;border-radius:10px;font-family:inherit"><option value="hard">🔥 어렵게</option><option value="normal">🙂 보통</option></select></div>
  <p class="note" id="lvDesc"></p>
  <label class="sw"><input type="checkbox" id="dist"> 📱 방해 모드 (알림·이모지가 날아와요)</label>
  <p class="note">① 방해 없이 한 판 → ② 방해 모드로 한 판 → 시간과 느낌을 비교해 봐요.</p>
  <button class="primary" id="start">시작하기</button>
</div>

<div class="card hide" id="play">
  <div class="bar"><span id="qno"></span><span id="timer">⏱ 0초</span><button class="sec" id="quit" style="padding:6px 12px;font-size:14px">✖ 그만하기</button></div>
  <div id="stage"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="card hide" id="result">
  <h2 style="margin:0 0 6px" id="resTitle">끝!</h2>
  <p id="resText" style="font-size:18px"></p>
  <label for="feel" style="font-weight:700">내 집중 느낌 (1 흐트러짐 ~ 5 쏙 빠짐)</label>
  <div class="row" id="feel" style="margin:8px 0">
    <button class="sec" data-f="1">1</button><button class="sec" data-f="2">2</button><button class="sec" data-f="3">3</button><button class="sec" data-f="4">4</button><button class="sec" data-f="5">5</button>
  </div>
  <button class="primary" id="again">다시 하기 / 모드 바꾸기</button>
</div>

<div class="card" id="logCard">
  <b>내 기록 (이 화면에서만 보여요)</b>
  <table><thead><tr><th>게임</th><th>방해</th><th>시간</th><th>틀린 수</th><th>느낌</th></tr></thead><tbody id="log"></tbody></table>
  <p class="note" id="cmp"></p>
</div>
</div>

const DESC={cho:'초성만 보고 단어를 맞혀요. 10문제, 한 문제에 30초! 시간이 지나면 정답을 알려 주고 다음 문제로 넘어가요.',scr:'필요한 글자만 골라 순서대로 눌러 단어를 만들어요. 7문제! 쓸모없는 글자도 섞여 있어요.',find:'글자판 사방에 흩어진 낱자를 순서대로 눌러 숨은 단어 5개를 만들어요. 제한 시간 안에!'};
const NAME={cho:'초성 퀴즈',scr:'흩어진 글자',find:'단어 찾기'};
let mode='cho',t0=0,tick=null,wrong=0,qi=0,Q=[],dTimer=null,lastRec=null,logs=[];
try{logs=JSON.parse(localStorage.getItem('focusGameLog')||'[]')}catch(e){}

document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));$('#modeDesc').textContent=DESC[mode]});
$('#modeDesc').textContent=DESC.cho;
const CD={study:'집중·공부와 관련된 단어예요.',fun:'요즘 친구들이 좋아하는 것들! 공부와는 상관없어요. 재미있는 단어일수록 눈이 더 가요.',mix:'공부 단어와 관심 단어가 섞여요. 단어 찾기에서는 공부 단어 5개만 찾고, 관심 단어는 함정이에요!'};
$('#cat').onchange=()=>$('#catDesc').textContent=CD[$('#cat').value];$('#catDesc').textContent=CD.study;
const LD={hard:'어려운 단어 위주예요. 초성 힌트는 10초 뒤에 열리고, 흩어진 글자는 필요 없는 글자가 6~7개, 단어 찾기는 9×9 판에 긴 단어와 함정 단어가 나와요. 단어 찾기 제한시간 120초.',normal:'쉬운·보통·어려운 단어가 골고루 나와요. 단어 찾기 제한시간 150초.'};
$('#lv').onchange=()=>$('#lvDesc').textContent=LD[$('#lv').value];$('#lvDesc').textContent=LD.hard;


function show(id,on){$(id).classList.toggle('hide',!on)}
function msg(t,ok){const m=$('#msg');m.textContent=t;m.style.color=ok?'#0E7C70':'#c0392b'}
function startTimer(){t0=Date.now();clearInterval(tick);tick=setInterval(()=>$('#timer').textContent='⏱ '+Math.floor((Date.now()-t0)/1000)+'초',500)}

/* distraction mode */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function startDist(){
  const msgs=['📱 카톡! 친구가 메시지를 보냈어요','🎮 새 게임 이벤트가 열렸어요!','▶️ 구독한 채널에 새 영상이 올라왔어요','🔔 오늘의 특가! 지금 확인하세요','😂 이거 봤어? 완전 웃겨ㅋㅋ'];
  const em=['📱','🎮','🍕','🐶','🎵','⚽'];
  dTimer=setInterval(()=>{
    if(Math.random()<.5)toast(msgs[Math.random()*msgs.length|0]);
    else{const f=document.createElement('div');f.className='float';f.textContent=em[Math.random()*em.length|0];f.style.top=(10+Math.random()*70)+'vh';document.body.appendChild(f);setTimeout(()=>f.remove(),3300)}
  },3500);
}
function stopDist(){clearInterval(dTimer);$('#toast').classList.remove('show')}

let gid=0,qTimer=null,TOTAL=10,foundN=0,FIND_T=150,HARD=true;
function stopAll(){gid++;clearInterval(tick);clearInterval(qTimer);stopDist()}
$('#start').onclick=()=>{
  stopAll();setBank();HARD=$('#lv').value==='hard';wrong=0;qi=0;TOTAL=mode==='cho'?10:7;show('#setup',false);show('#result',false);show('#play',true);msg('');
  if(mode==='find')initFind();else{Q=pickMix(BANK,TOTAL);nextQ()}
  startTimer();if($('#dist').checked)startDist();
};
$('#quit').onclick=()=>{stopAll();show('#play',false);show('#result',false);show('#setup',true);msg('');$('#timer').textContent='⏱ 0초'};

function finish(){
  clearInterval(tick);clearInterval(qTimer);stopDist();
  const sec=Math.round((Date.now()-t0)/1000);
  lastRec={game:NAME[mode]+({study:'',fun:'(관심)',mix:'(섞기)'})[$('#cat').value],dist:$('#dist').checked,sec,wrong,feel:null};
  show('#play',false);show('#result',true);
  $('#resTitle').textContent='🎉 끝!';
  $('#resText').innerHTML=`${mode==='find'?`찾은 단어 <b>${foundN}/5개</b>. `:''}<b>${sec}초</b> 걸렸어요. 틀린 횟수 <b>${wrong}번</b>${mode==='cho'?' (시간 초과 포함)':''}.<br>${lastRec.dist?'방해 모드였어요. 알림이나 이모지 때문에 눈이 갔나요?':'방해 없이 한 판 했어요. 이 느낌을 기억해 둬요!'}`;
  document.querySelectorAll('#feel button').forEach(b=>b.classList.remove('on'));
  saveLog();
}
function saveLog(){logs.push(lastRec);try{localStorage.setItem('focusGameLog',JSON.stringify(logs.slice(-12)))}catch(e){}renderLog()}
document.querySelectorAll('#feel button').forEach(b=>b.onclick=()=>{lastRec.feel=+b.dataset.f;document.querySelectorAll('#feel button').forEach(x=>x.style.background=x===b?'#FFC83D':'');try{localStorage.setItem('focusGameLog',JSON.stringify(logs.slice(-12)))}catch(e){}renderLog()});
$('#again').onclick=()=>{show('#result',false);show('#setup',true)};
function renderLog(){
  $('#log').innerHTML=logs.slice(-6).map(r=>`<tr><td>${r.game}</td><td>${r.dist?'📱있음':'없음'}</td><td>${r.sec}초</td><td>${r.wrong}</td><td>${r.feel??'-'}</td></tr>`).join('')||'<tr><td colspan="5" class="note">아직 기록이 없어요</td></tr>';
  const a=logs.filter(r=>!r.dist),b=logs.filter(r=>r.dist);
  $('#cmp').textContent=(a.length&&b.length)?`방해 없음 평균 ${Math.round(a.reduce((s,r)=>s+r.sec,0)/a.length)}초 · 방해 있음 평균 ${Math.round(b.reduce((s,r)=>s+r.sec,0)/b.length)}초. 시간과 느낌은 어떻게 달랐나요? 짝에게 말해 봐요.`:'방해 없음과 방해 모드를 각각 한 번씩 해 보면 비교할 수 있어요.';
}
renderLog();

/* 초성 & 흩어진 글자 */

function pickMix(list,n){
  const hard=$('#lv').value==='hard';
  const plan=hard?(n>=10?{1:0,2:3,3:7}:{1:0,2:2,3:5}):(n>=10?{1:3,2:4,3:3}:{1:2,2:3,3:2});
  const by={1:[],2:[],3:[]};shuf(list).forEach(x=>by[x[2]].push(x));
  const out=[];for(const lv of [1,2,3])out.push(...by[lv].splice(0,plan[lv]));
  const rest=shuf(hard?[...by[3],...by[2],...by[1]]:[...by[1],...by[2],...by[3]]);while(out.length<n&&rest.length)out.push(rest.shift());
  return shuf(out).slice(0,n);
}
function pickFind(list){
  const hard=$('#lv').value==='hard',Ls=hard?[3,4,5,6]:[2,3,4,5];
  const src=hard?list.filter(x=>x[2]>=2):list;
  const by={};shuf(src).forEach(x=>{const L=x[0].length;if(L>=Ls[0]&&L<=Ls[3])(by[L]=by[L]||[]).push(x)});
  const clash=(a,b)=>a.startsWith(b)||b.startsWith(a);
  const out=[];const fit=x=>!out.some(o=>clash(o[0],x[0]));
  for(const L of Ls){const i=(by[L]||[]).findIndex(fit);if(i>=0)out.push(by[L].splice(i,1)[0])}
  const rest=shuf(Ls.flatMap(L=>by[L]||[]));while(out.length<5&&rest.length){const x=rest.shift();if(fit(x))out.push(x)}
  return out.slice(0,5).map(x=>x[0]);
}
function buildBoard(N,SRC,mix,fixed){
  const hard=$('#lv').value==='hard';const nd=hard?(mix?5:3):(mix?3:0);
  let g,words,decoys;
  for(let t=0;t<150;t++){
    g=Array.from({length:N},()=>Array(N).fill(''));decoys=[];words=fixed||pickFind(SRC);
    const ok=words.every(w=>scatter(g,N,w));
    if(ok&&nd){const pool=(mix?FUN:SRC).filter(b=>b[0].length>=2&&b[0].length<=4&&!words.includes(b[0]));
      for(const [w] of shuf(pool)){if(decoys.length===nd)break;if([...words,...decoys].some(o=>o.startsWith(w)||w.startsWith(o)))continue;if(scatter(g,N,w))decoys.push(w)}}
    if(ok&&decoys.length===nd)break;
  }
  const letters=[...words.join(''),...decoys.join('')];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=(hard&&Math.random()<.65)?letters[Math.random()*letters.length|0]:ALLCH[Math.random()*ALLCH.length|0];
  return {g,words,decoys};
}
function scatter(g,N,w){
  // 같은 단어의 글자끼리: 서로 멀리(거리 3 이상 -> 안 되면 2), 같은 가로줄·세로줄 금지
  const dist=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]));
  const near=(r,c)=>{for(let a=r-1;a<=r+1;a++)for(let b=c-1;b<=c+1;b++)if(a>=0&&b>=0&&a<N&&b<N&&g[a][b])return true;return false};
  for(const D of [3,2]){
    for(let t=0;t<500;t++){const cs=[];let ok=true;
      for(let i=0;i<w.length;i++){let placed=false;
        for(let k=0;k<120;k++){const r=Math.random()*N|0,c=Math.random()*N|0;
          if(g[r][c])continue;
          if(cs.some(x=>dist(x,[r,c])<D||x[0]===r||x[1]===c))continue;
          cs.push([r,c]);placed=true;break}
        if(!placed){ok=false;break}}
      if(ok){cs.forEach(([r,c],i)=>g[r][c]=w[i]);return true}}
  }
  return false;
}

const ALLCH=[...new Set([...STUDY,...FUN].map(b=>b[0]).join(''))];
function nextQ(){
  const my=gid;const go=(f,ms)=>setTimeout(()=>{if(my===gid)f()},ms);
  clearInterval(qTimer);
  if(qi>=TOTAL)return finish();
  const [w,h]=Q[qi];$('#qno').textContent=`${qi+1} / ${TOTAL}`;msg('');
  if(mode==='cho'){
    $('#stage').innerHTML=`<div class="cd"><i id="cdb"></i></div><div class="cdt" id="cdt">남은 시간 30초</div><div class="big">${cho(w)}</div><div class="hint" id="hnt">${HARD?'🔒 힌트는 10초 뒤에 열려요 ('+w.length+'글자)':'💡 '+h+' ('+w.length+'글자)'}</div><input type="text" id="ans" autocomplete="off" placeholder="정답 쓰기"><button class="primary" id="ok" style="margin-top:10px">확인</button>`;
    let done=false;const t1=Date.now();
    qTimer=setInterval(()=>{
      const left=Math.max(0,30-(Date.now()-t1)/1000);
      $('#cdb').style.width=(left/30*100)+'%';$('#cdt').textContent='남은 시간 '+Math.ceil(left)+'초';if(HARD&&30-left>=10){const hh=$('#hnt');if(hh&&!hh.dataset.o){hh.dataset.o=1;hh.textContent='💡 '+h+' ('+w.length+'글자)'}}
      if(left<=0&&!done){done=true;clearInterval(qTimer);wrong++;$('#ans').disabled=true;$('#ok').disabled=true;msg(`⏰ 시간 끝! 정답은 '${w}'`,false);qi++;go(nextQ,1800)}
    },200);
    const chk=()=>{if(done)return;const v=$('#ans').value.trim();if(!v)return;if(v===w){done=true;clearInterval(qTimer);msg('정답! 👍',true);qi++;go(nextQ,700)}else{wrong++;msg('아쉬워요, 다시 생각해 봐요',false);$('#ans').select()}};
    $('#ok').onclick=chk;$('#ans').onkeydown=e=>{if(e.key==='Enter')chk()};$('#ans').focus();
  }else{
    const extra=shuf(ALLCH.filter(c=>!w.includes(c))).slice(0,(HARD?6:4)+(Math.random()<.5?1:0));
    let order=shuf([...w,...extra]);
    let got=[];
    const draw=()=>{
      $('#stage').innerHTML=`<div class="hint">💡 ${h} (${w.length}글자 단어)</div><p class="note" style="text-align:center">글자 ${order.length}개 중 ${w.length}개만 써요. 나머지 ${extra.length}개는 필요 없는 글자예요!</p><div class="tiles">${[...w].map((_,i)=>`<div class="slot">${got[i]?got[i].c:''}</div>`).join('')}</div><div class="tiles">${order.map((c,i)=>`<button class="tile ${got.some(g=>g.i===i)?'used':''}" data-i="${i}">${c}</button>`).join('')}</div><button class="sec" id="undo" style="width:100%">↩ 하나 지우기</button>`;
      document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const i=+t.dataset.i;if(got.some(g=>g.i===i))return;got.push({i,c:order[i]});if(got.length===w.length){if(got.map(g=>g.c).join('')===w){draw();msg('정답! 👍',true);qi++;go(nextQ,700);return}wrong++;msg('다시 골라 봐요. 필요 없는 글자가 섞여 있어요!',false);got=[]}draw()});
      $('#undo').onclick=()=>{got.pop();draw()};
    };draw();
  }
}

/* 단어 찾기 (낱자 흩어 놓기) */
function initFind(){
  const my=gid;FIND_T=HARD?120:150;const N=HARD?9:8;const mix=$('#cat').value==='mix';
  const SRC=mix?STUDY:BANK;let decoys=[],words=[],g;
  {const B=buildBoard(N,SRC,mix);g=B.g;words=B.words;decoys=B.decoys}
  const found=new Set();let sel=[];const used=new Set();foundN=0;
  $('#qno').textContent='숨은 단어 5개';
  const t1=Date.now();clearInterval(qTimer);
  qTimer=setInterval(()=>{if(my!==gid)return;const left=Math.max(0,FIND_T-(Date.now()-t1)/1000);
    const b=$('#cdb'),t=$('#cdt');if(b)b.style.width=(left/FIND_T*100)+'%';if(t){t.textContent='남은 시간 '+Math.ceil(left)+'초';t.style.color=left<=20?'#c0392b':'#0E7C70'}
    if(left<=0){clearInterval(qTimer);msg('⏰ 시간 끝!',false);setTimeout(()=>{if(my===gid)finish()},800)}},200);
  const key=(r,c)=>r+','+c;
  const word=()=>sel.map(([r,c])=>g[r][c]).join('');
  const draw=()=>{
    $('#stage').innerHTML=`<div class="cd"><i id="cdb"></i></div><div class="cdt" id="cdt">남은 시간 ${FIND_T}초</div><div class="words">${words.map(w=>`<span class="${found.has(w)?'ok':''}">${w}</span>`).join('')}</div><div class="hint" style="font-size:22px;min-height:34px">${word()||'글자를 순서대로 눌러요'}</div><div class="grid" style="grid-template-columns:repeat(${N},1fr)">${g.map((row,r)=>row.map((ch,c)=>`<button class="cell ${sel.some(x=>x[0]===r&&x[1]===c)?'pick':''} ${used.has(key(r,c))?'found':''}" data-r="${r}" data-c="${c}">${ch}</button>`).join('')).join('')}</div><div class="row" style="justify-content:center"><button class="sec" id="clr">↩ 지우기</button><button class="primary" id="chk" style="width:auto;padding:12px 28px">✔ 확인</button></div><p class="note" style="text-align:center">단어의 글자들이 <b>흩어져</b> 있어요. 글자를 <b>순서대로 하나씩</b> 눌러 단어를 만들어요.${decoys.length?'<br>목록에 없는 단어는 함정이에요!':''}</p>`;
    document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>tap(+b.dataset.r,+b.dataset.c));
    $('#clr').onclick=()=>{sel.pop();draw()};$('#chk').onclick=check;
  };
  const accept=s=>{const cells=sel.slice();found.add(s);foundN=found.size;cells.forEach(([r,c])=>used.add(key(r,c)));sel=[];msg(`'${s}' 찾았다! 👍`,true);if(found.size===5){draw();setTimeout(()=>{if(my===gid)finish()},700)}else draw()};
  const check=()=>{if(my!==gid||!sel.length)return;const s=word();
    if(words.includes(s)&&!found.has(s))return accept(s);
    wrong++;sel=[];msg(decoys.includes(s)?`'${s}'는 함정 단어예요! 😅`:'그런 단어는 없어요. 다시!',false);draw()};
  const tap=(r,c)=>{
    if(my!==gid||used.has(key(r,c)))return;
    const i=sel.findIndex(x=>x[0]===r&&x[1]===c);
    if(i>=0)sel.splice(i,1);else sel.push([r,c]);
    const s=word();
    if(words.includes(s)&&!found.has(s))return accept(s);
    if(decoys.includes(s)){wrong++;sel=[];msg(`'${s}'는 함정 단어예요! 😅`,false)}else msg('');
    draw();
  };
  draw();
}
