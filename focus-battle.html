<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>집중력 워밍업 대결 (큰 화면)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:#FAF8F3;color:#2B3A67;font-size:clamp(14px,1.4vw,22px)}
button{font-family:inherit;cursor:pointer;border:0;border-radius:14px;padding:.6em 1em;font-size:1em;font-weight:700}
.hide{display:none!important}
#setup{max-width:900px;margin:0 auto;padding:24px}
h1{margin:0 0 4px;font-size:2em}
.sub{color:#0E7C70;font-weight:700;margin-bottom:14px}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mode{background:#E3F6F3;color:#0E7C70}.mode.on{background:#1FB5A3;color:#fff}
input[type=text],select{font-family:inherit;font-size:1em;padding:.5em .7em;border:2px solid #cfd6e6;border-radius:12px}
.go{background:#FFC83D;color:#16294F;width:100%;font-size:1.3em;padding:.8em}
.note{font-size:.85em;color:#5b6690;line-height:1.5}
/* game */
#game{display:flex;flex-direction:column;height:100vh;padding:1.2vh 2vw;gap:1.2vh}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:1.5vw;align-items:stretch}
.pl{border-radius:20px;padding:1vh 1.5vw;color:#fff;display:flex;justify-content:space-between;align-items:center;border:6px solid transparent;transition:.15s}
.p0{background:#2B6BD6}.p1{background:#E8743B}
.pl.act{border-color:#FFC83D;box-shadow:0 0 0 6px #FFC83D66;transform:scale(1.03)}
.pl.lock{opacity:.45}
.pl .nm{font-size:1.5em;font-weight:800}.pl .key{font-size:.7em;opacity:.9}
.pl .sc{font-size:3.2em;font-weight:800;line-height:1}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:12vw;font-weight:800}
.mid .q{font-size:1.1em}.mid .t{font-size:2.6em;color:#0E7C70;line-height:1}
.mid .t.low{color:#c0392b}
.main{flex:1;background:#fff;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;padding:1.5vh 2vw;box-shadow:0 2px 10px #0001;min-height:0}
.hint{font-size:2em;color:#0E7C70;font-weight:700;text-align:center}
.huge{font-size:clamp(60px,12vw,200px);font-weight:800;letter-spacing:.12em;color:#16294F;line-height:1.1;text-align:center}
.tiles{display:flex;gap:1vw;flex-wrap:wrap;justify-content:center}
.tile{width:clamp(60px,8vw,140px);height:clamp(60px,8vw,140px);background:#2B3A67;color:#fff;border-radius:20px;font-size:clamp(34px,5vw,84px);font-weight:800;display:flex;align-items:center;justify-content:center}
.status{font-size:1.8em;font-weight:800;min-height:1.3em;text-align:center}
.ans{font-size:clamp(50px,9vw,150px);font-weight:800;color:#0E7C70}
.bar{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
.buzz{font-size:1.6em;color:#fff;padding:.7em 2em}
.b0{background:#2B6BD6}.b1{background:#E8743B}
.ok{background:#1FB5A3;color:#fff}.ng{background:#c0392b;color:#fff}.sec{background:#eef0f6;color:#2B3A67}
.cdbar{width:60%;height:12px;background:#e3e6ef;border-radius:99px;overflow:hidden}.cdbar i{display:block;height:100%;background:#1FB5A3}
.words{display:flex;gap:.6vw;flex-wrap:wrap;justify-content:center}
.words span{background:#eef0f6;border-radius:99px;padding:.2em .9em;font-weight:800;font-size:1.3em}
.words span.ok{background:#1FB5A3;color:#fff;text-decoration:line-through}
.grid{display:grid;gap:.5vh;height:100%;aspect-ratio:1}
.gwrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
.cell{background:#f1f3f9;color:#2B3A67;border-radius:12px;font-size:clamp(20px,min(3.4vw,4.6vh),56px);font-weight:800;padding:0;line-height:1;min-height:0;overflow:hidden}
.cell.pick{background:#FFC83D}.cell.found{background:#1FB5A3;color:#fff}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#16294F;color:#fff;border-radius:14px;padding:12px 22px;font-weight:700;z-index:9;pointer-events:none;opacity:0;transition:opacity .2s;font-size:1.3em}
#toast.show{opacity:1}
.float{position:fixed;font-size:64px;z-index:8;pointer-events:none;animation:fl 3.2s linear forwards}
@keyframes fl{from{transform:translateX(-80px) rotate(0)}to{transform:translateX(110vw) rotate(360deg)}}
#end{max-width:900px;margin:8vh auto;text-align:center;padding:24px}
#end h2{font-size:3em;margin:0}
</style></head><body>
<div id="toast"></div>

<div id="setup">

  <div class="card">
    <b>게임</b>
    <div class="row">
      <button class="mode on" data-m="cho">🔤 초성 퀴즈 (10문제·30초)</button>
      <button class="mode" data-m="scr">🔀 흩어진 글자 (7문제·40초)</button>
      <button class="mode" data-m="find">🔍 단어 찾기 (한 명씩 시간 대결)</button>
    </div>
    <p class="note" id="md"></p>
    <div class="row"><b>단어</b>
      <select id="cat"><option value="study">📚 공부·집중 단어</option><option value="fun">🎮 요즘 관심 단어</option><option value="mix">🔀 섞어서</option></select>
      <label><input type="checkbox" id="dist"> 📱 방해 모드</label>
      <b>난이도</b><select id="lv"><option value="hard">🔥 어렵게</option><option value="normal">🙂 보통</option></select></div>
    <p class="note" id="lvDesc"></p>
    <div class="row"><b>선수</b>
      <input type="text" id="n0" placeholder="별명 1" maxlength="8" style="width:9em">
      <span style="font-weight:800">VS</span>
      <input type="text" id="n1" placeholder="별명 2" maxlength="8" style="width:9em"></div>
    <p class="note">🔔 외치기 키: 선수1 = <b>A</b>, 선수2 = <b>L</b> (화면 버튼도 눌러도 돼요). 선생님 판정: <b>O</b> 정답 · <b>X</b> 오답 · <b>N</b> 다음 문제. 한글 입력 상태에서도 작동해요. 별명만 써요!</p>
  </div>
  <button class="go" id="start">시작!</button>
</div>

<div id="game" class="hide">
  <div class="top">
    <div class="pl p0" id="pl0"><div><div class="nm" id="nm0"></div><div class="key">🔔 A키</div></div><div class="sc" id="sc0">0</div></div>
    <div class="mid"><div class="q" id="qno"></div><div class="t" id="tm">30</div></div>
    <div class="pl p1" id="pl1"><div class="sc" id="sc1">0</div><div style="text-align:right"><div class="nm" id="nm1"></div><div class="key">🔔 L키</div></div></div>
  </div>
  <div class="main" id="main"></div>
  <div class="bar" id="ctl"></div>
</div>

<div id="end" class="hide card">
  <h2 id="eT"></h2><p id="eP" style="font-size:1.6em"></p>
  <p class="note">점수보다 중요한 것: 방해가 있을 때와 없을 때 내 집중은 어땠나요?</p>
  <button class="go" id="again" style="width:auto">처음으로</button>
</div>

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const cho=w=>[...w].map(c=>CHO[Math.floor((c.charCodeAt(0)-0xAC00)/588)]).join('');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);

function pickMix(list,n){
  const hard=$('#lv').value==='hard';
  const plan=hard?(n>=10?{1:0,2:3,3:7}:{1:0,2:2,3:5}):(n>=10?{1:3,2:4,3:3}:{1:2,2:3,3:2});
  const by={1:[],2:[],3:[]};shuf(list).forEach(x=>by[x[2]].push(x));
  const out=[];for(const lv of [1,2,3])out.push(...by[lv].splice(0,plan[lv]));
  const rest=shuf(hard?[...by[3],...by[2],...by[1]]:[...by[1],...by[2],...by[3]]);while(out.length<n&&rest.length)out.push(rest.shift());
  return shuf(out).slice(0,n);
}
function pickFind(list){
  const hard=$('#lv').value==='hard',Ls=hard?[3,4,5,6]:[2,3,4,5];
  const src=hard?list.filter(x=>x[2]>=2):list;
  const by={};shuf(src).forEach(x=>{const L=x[0].length;if(L>=Ls[0]&&L<=Ls[3])(by[L]=by[L]||[]).push(x)});
  const clash=(a,b)=>a.startsWith(b)||b.startsWith(a);
  const out=[];const fit=x=>!out.some(o=>clash(o[0],x[0]));
  for(const L of Ls){const i=(by[L]||[]).findIndex(fit);if(i>=0)out.push(by[L].splice(i,1)[0])}
  const rest=shuf(Ls.flatMap(L=>by[L]||[]));while(out.length<5&&rest.length){const x=rest.shift();if(fit(x))out.push(x)}
  return out.slice(0,5).map(x=>x[0]);
}
function buildBoard(N,SRC,mix,fixed){
  const hard=$('#lv').value==='hard';const nd=hard?(mix?5:3):(mix?3:0);
  let g,words,decoys;
  for(let t=0;t<150;t++){
    g=Array.from({length:N},()=>Array(N).fill(''));decoys=[];words=fixed||pickFind(SRC);
    const ok=words.every(w=>scatter(g,N,w));
    if(ok&&nd){const pool=(mix?FUN:SRC).filter(b=>b[0].length>=2&&b[0].length<=4&&!words.includes(b[0]));
      for(const [w] of shuf(pool)){if(decoys.length===nd)break;if([...words,...decoys].some(o=>o.startsWith(w)||w.startsWith(o)))continue;if(scatter(g,N,w))decoys.push(w)}}
    if(ok&&decoys.length===nd)break;
  }
  const letters=[...words.join(''),...decoys.join('')];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=(hard&&Math.random()<.65)?letters[Math.random()*letters.length|0]:ALLCH[Math.random()*ALLCH.length|0];
  return {g,words,decoys};
}
function scatter(g,N,w){
  // 같은 단어의 글자끼리: 서로 멀리(거리 3 이상 -> 안 되면 2), 같은 가로줄·세로줄 금지
  const dist=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]));
  const near=(r,c)=>{for(let a=r-1;a<=r+1;a++)for(let b=c-1;b<=c+1;b++)if(a>=0&&b>=0&&a<N&&b<N&&g[a][b])return true;return false};
  for(const D of [3,2]){
    for(let t=0;t<500;t++){const cs=[];let ok=true;
      for(let i=0;i<w.length;i++){let placed=false;
        for(let k=0;k<120;k++){const r=Math.random()*N|0,c=Math.random()*N|0;
          if(g[r][c])continue;
          if(cs.some(x=>dist(x,[r,c])<D||x[0]===r||x[1]===c))continue;
          cs.push([r,c]);placed=true;break}
        if(!placed){ok=false;break}}
      if(ok){cs.forEach(([r,c],i)=>g[r][c]=w[i]);return true}}
  }
  return false;
}

const ALLCH=[...new Set([...STUDY,...FUN].map(b=>b[0]).join(''))];
const MD={cho:'초성만 보고 먼저 🔔 누른 친구가 답해요. 틀리면 상대에게 기회가 가요. 30초 안에 아무도 못 맞히면 정답을 알려 줘요.',scr:'흩어진 글자 중 필요한 글자만 골라 단어를 말해요. 필요 없는 글자가 섞여 있어요! 먼저 🔔 누른 친구가 답해요.',find:'숨은 단어 5개의 글자가 글자판 사방에 흩어져 있어요. 한 명씩 차례로 모두 찾고(제한 시간 안에), 더 많이·더 빨리 찾은 친구가 이겨요. 두 번째 친구는 같은 단어, 새 글자판이에요!'};
let mode='cho';
const LD={hard:'어려운 단어 위주 · 초성 힌트는 10초 뒤 공개 · 흩어진 글자는 필요 없는 글자 6~7개 · 단어 찾기는 9×9 판, 긴 단어, 함정 단어, 120초',normal:'쉬운·보통·어려운 단어가 골고루 · 단어 찾기 150초'};
document.addEventListener('DOMContentLoaded',()=>{});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));$('#md').textContent=MD[mode]});$('#md').textContent=MD.cho;
$('#lv').onchange=()=>$('#lvDesc').textContent=LD[$('#lv').value];$('#lvDesc').textContent=LD.hard;

let S=null,gid=0,loop=null,dT=null;
function bank(){const c=$('#cat').value;return c==='study'?STUDY:c==='fun'?FUN:[...STUDY,...FUN]}
function stopAll(){gid++;clearInterval(loop);clearInterval(dT);$('#toast').classList.remove('show')}
function startDist(){const m=['📱 카톡! 친구가 메시지를 보냈어요','🎮 새 게임 이벤트가 열렸어요!','▶️ 새 영상이 올라왔어요','🔔 오늘의 특가!','😂 이거 봤어? 완전 웃겨ㅋㅋ'],em=['📱','🎮','🍕','🐶','🎵','⚽'];
 dT=setInterval(()=>{if(Math.random()<.5){const e=$('#toast');e.textContent=m[Math.random()*m.length|0];e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}else{const f=document.createElement('div');f.className='float';f.textContent=em[Math.random()*em.length|0];f.style.top=(10+Math.random()*70)+'vh';document.body.appendChild(f);setTimeout(()=>f.remove(),3300)}},3500)}

$('#start').onclick=()=>{
  stopAll();
  const names=[$('#n0').value.trim()||'친구1',$('#n1').value.trim()||'친구2'];
  S={mode,hard:$('#lv').value==='hard',names,score:[0,0],qi:0,total:mode==='cho'?10:7,Q:[],phase:'',locked:[false,false],holder:-1,qt:30,at:10,cur:0,found:new Set(),marks:[],first:null,words:[],decoys:[],g:null,extra:[],order:[]};
  $('#setup').classList.add('hide');$('#end').classList.add('hide');$('#game').classList.remove('hide');
  $('#nm0').textContent=names[0];$('#nm1').textContent=names[1];
  if($('#dist').checked)startDist();
  if(mode==='find')initFind();else{S.Q=pickMix(bank(),S.total);nextQ()}
};
function quit(){stopAll();$('#game').classList.add('hide');$('#end').classList.add('hide');$('#setup').classList.remove('hide')}
$('#again').onclick=quit;

function scoreUI(){
  $('#sc0').textContent=S.score[0];$('#sc1').textContent=S.score[1];
  for(const p of [0,1]){const e=$('#pl'+p);
    e.classList.toggle('act',S.mode==='find'?S.cur===p:S.holder===p);
    e.classList.toggle('lock',S.mode!=='find'&&S.locked[p]&&S.phase!=='reveal')}
}
function ctl(h){$('#ctl').innerHTML=h;
  $('#ctl').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a))}
function act(a){
  if(a==='b0')buzz(0);else if(a==='b1')buzz(1);else if(a==='ok')judge(true);else if(a==='ng')judge(false);else if(a==='next')skip();else if(a==='quit')quit();else if(a==='clr')findClear();else if(a==='chk')findWrong();else if(a==='go'&&S&&S.phase==='fready')startFind()}
function ctlRound(){ctl(`<button class="buzz b0" data-a="b0">🔔 ${S.names[0]}</button><button class="ok" data-a="ok">⭕ 정답</button><button class="ng" data-a="ng">❌ 오답</button><button class="buzz b1" data-a="b1">🔔 ${S.names[1]}</button><button class="sec" data-a="next">다음 ▶</button><button class="sec" data-a="quit">✖ 그만하기</button>`)}

/* round games */
function nextQ(){
  clearInterval(loop);
  if(S.qi>=S.total)return end();
  const [w,h]=S.Q[S.qi];S.w=w;S.h=h;S.phase='ready';S.locked=[false,false];S.holder=-1;
  S.maxT=S.mode==='cho'?30:40;S.qt=S.maxT;
  $('#qno').textContent=`${S.qi+1} / ${S.total}`;
  if(S.mode==='scr'){const ex=shuf(ALLCH.filter(c=>!w.includes(c))).slice(0,(S.hard?6:4)+(Math.random()<.5?1:0));S.order=shuf([...w,...ex]);S.n=w.length;S.nx=ex.length}
  renderQ('');ctlRound();scoreUI();
  const my=gid;let last=Date.now();
  loop=setInterval(()=>{if(my!==gid)return;const now=Date.now(),dt=(now-last)/1000;last=now;
    if(S.phase==='ready'){S.qt-=dt;if(S.qt<=0){S.qt=0;reveal('⏰ 시간 끝!')}}
    else if(S.phase==='answering'){S.at-=dt;if(S.at<=0){judge(false)}}
    tickUI()},100);
}
const hintOpen=()=>!(S.hard&&S.mode==='cho')||S.phase==='reveal'||(S.maxT-S.qt>=10);
const hintTxt=()=>hintOpen()?`💡 ${S.h} (${S.w.length}글자)`:`🔒 힌트는 10초 뒤에 열려요 (${S.w.length}글자)`;
function tickUI(){const hh=$('#hnt');if(hh)hh.textContent=hintTxt();const t=$('#tm');const v=S.phase==='answering'?S.at:S.qt;t.textContent=Math.ceil(v);t.classList.toggle('low',v<=5);
  const b=$('#cdb');if(b)b.style.width=(S.qt/S.maxT*100)+'%'}
function renderQ(status,ans){
  const w=S.w;let body;
  if(S.mode==='cho')body=`<div class="huge">${cho(w)}</div>`;
  else body=`<div class="tiles">${S.order.map(c=>`<div class="tile">${c}</div>`).join('')}</div><div class="note" style="font-size:1.1em">글자 ${S.order.length}개 중 ${S.n}개만 써요! (필요 없는 글자 ${S.nx}개)</div>`;
  $('#main').innerHTML=`<div class="cdbar"><i id="cdb" style="width:${S.qt/S.maxT*100}%"></i></div><div class="hint" id="hnt">${hintTxt()}</div>${body}${ans?`<div class="ans">${w}</div>`:''}<div class="status" id="st" style="color:${status.startsWith('❌')||status.startsWith('⏰')?'#c0392b':'#0E7C70'}">${status}</div>`;
}
function buzz(p){
  if(!S||S.mode==='find'||S.phase!=='ready'||S.locked[p])return;
  S.holder=p;S.phase='answering';S.at=10;
  renderQ(`🔔 ${S.names[p]} 도전! (10초 안에 말해요)`);scoreUI();tickUI();
}
function judge(ok){
  if(!S||S.mode==='find'){if(S&&S.mode==='find')findJudge(ok);return}
  if(S.phase!=='answering')return;
  const p=S.holder;
  if(ok){S.score[p]++;scoreUI();reveal(`⭕ ${S.names[p]} 정답! +1`)}
  else{S.locked[p]=true;S.holder=-1;
    if(S.locked[0]&&S.locked[1]){reveal('둘 다 아쉬워요!')}
    else{S.phase='ready';renderQ(`❌ ${S.names[p]} 아쉬워요! ${S.names[1-p]}에게 기회!`);scoreUI()}}
}
function reveal(text){
  S.phase='reveal';S.holder=-1;scoreUI();renderQ(text,true);tickUI();
  const my=gid;setTimeout(()=>{if(my===gid&&S.phase==='reveal'){S.qi++;nextQ()}},2600);
}
function skip(){if(S&&S.mode==='find'){if(S.phase==='fready')startFind();return}if(!S)return;if(S.phase==='reveal'){S.qi++;nextQ()}else reveal('다음 문제로!')}

/* 단어 찾기: 한 명씩 시간 대결 (같은 단어, 새 글자판) */
let FTIME=150;
function initFind(){
  S.fmix=$('#cat').value==='mix';S.words=pickFind(S.fmix?STUDY:bank());S.N=S.hard?9:8;FTIME=S.hard?120:150;S.fres=[null,null];S.cur=0;
  $('#qno').textContent='숨은 단어 5개';
  ctl(`<button class="sec" data-a="quit">✖ 그만하기</button>`);
  readyFind();
}
function makeBoard(){const B=buildBoard(S.N,S.fmix?STUDY:bank(),S.fmix,S.words);S.g=B.g;S.decoys=B.decoys}
function readyFind(){
  clearInterval(loop);S.phase='fready';S.found=new Set();S.sel=[];S.used=new Set();S.wr=0;scoreUI();
  const p=S.cur;$('#tm').textContent='0';$('#tm').classList.remove('low');
  ctl(`<button class="sec" data-a="quit">✖ 그만하기</button>`);
  $('#main').innerHTML=`<div class="hint" style="font-size:2.6em;color:${p?'#E8743B':'#2B6BD6'}">${S.names[p]} 차례!</div>
  <div class="status" style="color:#16294F;font-weight:700;line-height:1.5">숨은 단어 5개를 <b>가장 빨리, 모두</b> 찾아요.<br>제한 시간 ${FTIME}초 · 시간이 같으면 틀린 횟수가 적은 쪽이 이겨요.${p?'<br>같은 단어, <b>새로운 글자판</b>이에요!':''}</div>
  ${S.res0?`<div class="note" style="font-size:1.1em">${S.names[0]}: ${S.res0}</div>`:''}
  <button class="go" data-a="go" style="width:auto;padding:.8em 2.2em;font-size:1.6em">▶ 시작! (Enter)</button>`;
  $('#main').querySelector('[data-a=go]').onclick=()=>act('go');
}
function startFind(){
  makeBoard();S.phase='find';S.t0=Date.now();
  ctl(`<button class="sec" data-a="clr">↩ 지우기</button><button class="ng" data-a="chk">❌ 오답</button><button class="sec" data-a="quit">✖ 그만하기</button>`);
  const my=gid;clearInterval(loop);
  loop=setInterval(()=>{if(my!==gid||S.phase!=='find')return;const e=(Date.now()-S.t0)/1000;
    $('#tm').textContent=Math.floor(e);$('#tm').classList.toggle('low',e>=FTIME-20);
    if(e>=FTIME)finishRound(true)},200);
  drawFind('');
}
const selWord=()=>S.sel.map(([r,c])=>S.g[r][c]).join('');
function drawFind(st){
  const {g,words,N}=S;
  $('#main').innerHTML=`<div class="words">${words.map(w=>`<span class="${S.found.has(w)?'ok':''}">${w}</span>`).join('')}</div><div class="status" style="color:${S.cur?'#E8743B':'#2B6BD6'}">${S.names[S.cur]} 도전 중! ${st}</div><div class="status" style="min-height:1.3em;color:#16294F">${selWord()}</div><div class="gwrap"><div class="grid" style="grid-template-columns:repeat(${N},1fr);grid-template-rows:repeat(${N},1fr)">${g.map((row,r)=>row.map((ch,c)=>`<button class="cell ${S.sel.some(x=>x[0]===r&&x[1]===c)?'pick':''} ${S.used.has(r+','+c)?'found':''}" data-r="${r}" data-c="${c}">${ch}</button>`).join('')).join('')}</div></div><div class="note" style="margin:0">${S.decoys.length?'목록에 없는 단어는 함정이에요! ':''}글자가 흩어져 있어요. 순서대로 눌러서 단어를 만들어요. (찾은 단어 ${S.found.size}/5 · 틀림 ${S.wr}번)</div>`;
  document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>findTap(+b.dataset.r,+b.dataset.c));
  $('#sc'+S.cur).textContent=S.found.size;
}
function findTap(r,c){
  if(S.phase!=='find'||S.used.has(r+','+c))return;
  const i=S.sel.findIndex(x=>x[0]===r&&x[1]===c);
  if(i>=0)S.sel.splice(i,1);else S.sel.push([r,c]);
  const s=selWord();
  if(S.words.includes(s)&&!S.found.has(s)){S.found.add(s);S.sel.forEach(([a,b])=>S.used.add(a+','+b));S.sel=[];
    if(S.found.size===5){drawFind('');return setTimeout(()=>finishRound(false),500)}
    return drawFind(`⭕ '${s}'!`)}
  if(S.decoys.includes(s)){S.sel=[];S.wr++;return drawFind(`'${s}'는 함정!`)}
  drawFind('');
}
function findClear(){if(S.phase==='find'){S.sel.pop();drawFind('')}}
function findWrong(){if(S.phase!=='find'||!S.sel.length)return;S.sel=[];S.wr++;drawFind('아쉬워요!')}
function findJudge(){}
function finishRound(timeUp){
  if(S.phase!=='find')return;
  clearInterval(loop);S.phase='fdone';
  const p=S.cur,sec=Math.min(FTIME,Math.round((Date.now()-S.t0)/100)/10);
  S.fres[p]={n:S.found.size,sec,wr:S.wr};S.score[p]=S.found.size;scoreUI();
  const txt=`${S.found.size}/5개 · ${sec}초 · 틀림 ${S.wr}번${timeUp?' (시간 끝)':''}`;
  $('#main').innerHTML=`<div class="hint" style="font-size:2.4em">${timeUp?'⏰ 시간 끝!':'🎉 모두 찾았어요!'}</div><div class="ans" style="font-size:clamp(40px,5vw,90px)">${S.names[p]}: ${txt}</div>`;
  const my=gid;setTimeout(()=>{if(my!==gid)return;
    if(p===0){S.res0=txt;S.cur=1;readyFind()}else end()},2600);
}

function end(){
  stopAll();$('#game').classList.add('hide');$('#end').classList.remove('hide');
  const [n0,n1]=S.names;
  if(S.mode==='find'){const r0=S.fres[0]||{n:0,sec:FTIME,wr:0},r1=S.fres[1]||{n:0,sec:FTIME,wr:0};
    let w=-1;if(r0.n!==r1.n)w=r0.n>r1.n?0:1;else if(r0.sec!==r1.sec)w=r0.sec<r1.sec?0:1;else if(r0.wr!==r1.wr)w=r0.wr<r1.wr?0:1;
    $('#eT').textContent=w<0?'🤝 무승부!':`🏆 ${S.names[w]} 승리!`;
    $('#eP').innerHTML=`${n0}: ${r0.n}개 · ${r0.sec}초 · 틀림 ${r0.wr}<br>${n1}: ${r1.n}개 · ${r1.sec}초 · 틀림 ${r1.wr}`;return}
  const [a,b]=S.score;
  $('#eT').textContent=a===b?'🤝 무승부!':`🏆 ${a>b?n0:n1} 승리!`;
  $('#eP').textContent=`${n0} ${a}점  :  ${b}점 ${n1}`;
}
document.addEventListener('keydown',e=>{
  if($('#game').classList.contains('hide')||e.repeat)return;
  const m={KeyA:'b0',KeyL:'b1',KeyO:'ok',KeyX:'ng',KeyN:'next',Enter:'go',NumpadEnter:'go'}[e.code];if(m){e.preventDefault();act(m)}
});
